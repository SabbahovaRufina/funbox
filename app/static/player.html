<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Player</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  .hidden { display: none; }
  #welcome { text-align: center; margin-top: 40px; }
  input { padding: 8px; font-size: 16px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  button { padding: 10px 16px; font-size: 16px; cursor: pointer; margin-top: 8px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* Карты-кнопки */
  .card {
    display: block; width: 100%; box-sizing: border-box; text-align: left;
    border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin: 6px 0;
    background: #fff; font: inherit; color: inherit;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .card b { text-transform: capitalize; }
  .card .muted { color: #888; font-size: 13px; }

  /* Активна — в свой ход, ещё не раскрыта */
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: #90cdf4; background: #f0f9ff; }
  .card.clickable:active { transform: scale(.99); }

  /* Неактивна — вне хода */
  .card.disabled { cursor: not-allowed; opacity: .7; }

  /* Раскрыта */
  .card.revealed { opacity: .55; background: #f7fafc; border-style: dashed; cursor: default; }

  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px;
           background: #edf2f7; color: #4a5568; margin-left: 6px; }
  .badge.revealed { background: #c6f6d5; color: #276749; }

  .timer { font-size: 20px; font-weight: bold; color: #2b6cb0; }
  .timer.low { color: #c53030; }
  .panel { border: 1px solid #cbd5e0; border-radius: 10px; padding: 14px; margin: 14px 0; background: #f7fafc; }
  .turn-banner { font-size: 16px; font-weight: 600; margin: 8px 0; }
  .turn-banner.mine { color: #2f855a; }
  .turn-banner.not-mine { color: #718096; }

  #log { color: #aaa; font-size: 11px; max-height: 120px; overflow: auto; }
  .hint { font-size: 13px; color: #d97706; }
</style>
</head>
<body>

<!-- Экран входа -->
<div id="join-screen">
  <h1>Игрок</h1>
  <input id="name" placeholder="Имя">
  <input id="code" placeholder="Код лобби">
  <button id="join">Войти</button>
  <p id="error" style="color:red"></p>
</div>

<!-- Приветственный экран -->
<div id="welcome" class="hidden">
  <h1>Привет, <span id="welcome-name"></span>!</h1>
  <p>Ты в лобби <b id="welcome-code"></b></p>
  <p>Ждём начала игры…</p>
</div>

<!-- Экран игры: карты + статус хода -->
<div id="game-screen" class="hidden">
  <h2>Твои карты</h2>
  <p class="muted">Пол: <span id="player-gender">—</span></p>

  <div class="panel">
    <div id="turn-banner" class="turn-banner not-mine">Ожидание…</div>
    <div id="timer-row" class="hidden">
      <span class="timer" id="timer">—</span>
    </div>
    <div id="turn-hint" class="hint hidden"></div>
  </div>

  <div id="cards"></div>
</div>

<pre id="log"></pre>

<script>
const joinScreen = document.getElementById('join-screen');
const welcomeScreen = document.getElementById('welcome');
const gameScreen = document.getElementById('game-screen');
const logEl = document.getElementById('log');
const log = (s) => { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; };

let ws = null;
let myId = null;
let myCards = [];              // [{id, field, title, description}]
let revealedIds = new Set();   // что я уже раскрыл (глобально)
let currentLimit = 3;          // лимит карт на этот ход (для инфо)
let revealedThisTurn = 0;      // сколько раскрыто в текущем ходе (сбрасывается при reveal_turn)
let myTurn = false;
let timerInterval = null;

const FIELD_TITLES = {
  profession: 'Профессия',
  bio: 'Биография',
  health: 'Здоровье',
  hobby: 'Хобби',
  phobia: 'Фобия',
  baggage: 'Багаж',
  fact: 'Факт',
  special: 'Особое условие',
  secret: 'Секрет',
};

function escapeHtml(s) {
  return String(s ?? '')
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;').replaceAll('"', '&quot;');
}

// --- таймер ---

function startTimer(seconds) {
  stopTimer();
  const el = document.getElementById('timer');
  const row = document.getElementById('timer-row');
  row.classList.remove('hidden');

  let left = Math.max(0, Math.floor(seconds));
  el.textContent = `${left} с`;
  el.classList.toggle('low', left <= 10);

  timerInterval = setInterval(() => {
    left -= 1;
    if (left <= 0) {
      el.textContent = '0 с';
      el.classList.add('low');
      stopTimer();
      return;
    }
    el.textContent = `${left} с`;
    el.classList.toggle('low', left <= 10);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  const row = document.getElementById('timer-row');
  if (row) row.classList.add('hidden');
}

// --- рендер карт как кнопок ---

function renderCards() {
  const box = document.getElementById('cards');
  box.innerHTML = '';

  for (const c of myCards) {
    const isRevealed = revealedIds.has(c.id);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.dataset.cardId = c.id;

    if (isRevealed) {
      btn.classList.add('revealed');
      btn.disabled = false; // оставляем «нажимаемой» визуально, но обработчик не вешаем
    } else if (myTurn) {
      btn.classList.add('clickable');
    } else {
      btn.classList.add('disabled');
    }

    const fieldTitle = FIELD_TITLES[c.field] || c.field;
    const badge = isRevealed ? '<span class="badge revealed">раскрыто</span>' : '';
    btn.innerHTML =
      `<b>${escapeHtml(fieldTitle)}</b>: ${escapeHtml(c.title)}${badge}` +
      (c.description ? `<div class="muted">${escapeHtml(c.description)}</div>` : '');

    // Клик: раскрываем только если сейчас мой ход и карта не раскрыта
    btn.onclick = () => onCardClick(c.id);

    box.appendChild(btn);
  }
}

function onCardClick(cardId) {
  if (!myTurn) {
    // TODO: показать уведомление «сейчас не твой ход»
    log('не твой ход — клик проигнорирован');
    return;
  }
  if (revealedIds.has(cardId)) return; // уже раскрыта
  if (revealedThisTurn >= currentLimit) {
    log('лимит раскрытий на этот ход исчерпан');
    return;
  }

  // шлём одну карту — сервер добавит её в revealed
  ws.send(JSON.stringify({ type: 'reveal_cards', data: { card_ids: [cardId] } }));
  log('→ reveal_cards ' + cardId);
  // Ждём reveal_ack, чтобы пометить как раскрытую (не оптимистично,
  // чтобы не рассинхронизироваться с сервером)
}

// --- статус хода ---

function setTurnBanner(text, mine) {
  const el = document.getElementById('turn-banner');
  el.textContent = text;
  el.classList.toggle('mine', !!mine);
  el.classList.toggle('not-mine', !mine);
}

function showMyTurn(seconds) {
  myTurn = true;
  revealedThisTurn = 0;
  setTurnBanner('Твой ход! Раскрой карты и объясни, почему тебя стоит взять.', true);
  document.getElementById('turn-hint').classList.remove('hidden');
  document.getElementById('turn-hint').textContent =
    'Нажми на карту, чтобы раскрыть её. Потом расскажи о себе — таймер продолжает идти.';
  startTimer(seconds);
  renderCards();
}

function showWaiting(playerId, seconds) {
  myTurn = false;
  const mine = playerId === myId;

  if (mine) {
    // на случай, если reveal_turn пришёл про меня — сразу в мой ход
    showMyTurn(seconds);
    return;
  }

  setTurnBanner(playerId ? `Сейчас ходит: ${playerId}` : 'Ожидание…', false);
  document.getElementById('turn-hint').classList.add('hidden');
  if (seconds > 0) startTimer(seconds);
  else stopTimer();
  renderCards();
}

// --- join ---

document.getElementById('join').onclick = () => {
  const name = document.getElementById('name').value.trim();
  const code = document.getElementById('code').value.trim().toUpperCase();
  document.getElementById('error').textContent = '';

  if (!name || !code) {
    document.getElementById('error').textContent = 'Введите имя и код';
    return;
  }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(
    `${proto}://${location.host}/ws/player/${code}?name=${encodeURIComponent(name)}`
  );

  ws.onopen = () => log('ws открыт');

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { log('не JSON: ' + e.data); return; }
    log('← ' + JSON.stringify(msg));

    const t = msg.type;
    const d = msg.data || {};

    if (t === 'welcome') {
      myId = d.player_id;
      document.getElementById('welcome-name').textContent = d.name;
      document.getElementById('welcome-code').textContent = code;
      joinScreen.classList.add('hidden');
      welcomeScreen.classList.remove('hidden');

    } else if (t === 'your_cards') {
      myCards = d.cards || [];
      document.getElementById('player-gender').textContent =
        d.gender === 'male' ? 'мужской' :
        d.gender === 'female' ? 'женский' : 'нейтральный';
      welcomeScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      setTurnBanner('Ждём начала раунда раскрытия…', false);
      renderCards();

    } else if (t === 'game_started') {
      log('игра началась');

    } else if (t === 'reveal_started') {
      currentLimit = d.reveal_limit;
      // сбрасываем локальный счётчик «в этом ходе» — начинается новый круг
      revealedThisTurn = 0;
      renderCards();
      if (d.current_player_id === myId) {
        showMyTurn(d.deadline_in);
      } else {
        showWaiting(d.current_player_id, d.deadline_in);
      }

    } else if (t === 'reveal_turn') {
      revealedThisTurn = 0;
      if (d.current_player_id === myId) {
        showMyTurn(d.deadline_in);
      } else {
        showWaiting(d.current_player_id, d.deadline_in);
      }

    } else if (t === 'reveal_ack') {
      // сервер подтвердил раскрытие — помечаем карты
      for (const id of d.revealed || []) {
        revealedIds.add(id);
        revealedThisTurn += 1;
      }
      // ВАЖНО: не уходим с экрана «мой ход» — игрок ещё говорит,
      // таймер продолжает идти. Ход перейдёт по reveal_turn/timeout.
      renderCards();
      if (revealedThisTurn >= currentLimit) {
        document.getElementById('turn-hint').textContent =
          'Лимит раскрытий исчерпан. Расскажи о себе — таймер идёт.';
      }

    } else if (t === 'cards_revealed') {
      // кто-то (возможно, я) раскрыл — логируем
      log(`раскрыл ${d.player_id}: ${(d.cards || []).length} карт`);

    } else if (t === 'reveal_timeout') {
      if (d.player_id === myId) {
        // время вышло — сервер мог сам добрать карты за меня
        for (const id of d.revealed || []) revealedIds.add(id);
        myTurn = false;
        stopTimer();
        setTurnBanner('Время вышло. Ждём следующего игрока…', false);
        document.getElementById('turn-hint').classList.add('hidden');
        renderCards();
      }

    } else if (t === 'reveal_round_finished') {
      log(`Круг ${d.round_number} завершён`);
      myTurn = false;
      stopTimer();
      setTurnBanner('Круг завершён. Ждём следующий…', false);
      document.getElementById('turn-hint').classList.add('hidden');
      renderCards();

    } else if (t === 'phase_changed') {
      myTurn = false;
      stopTimer();
      setTurnBanner('Фаза: ' + d.phase, false);
      document.getElementById('turn-hint').classList.add('hidden');
      renderCards();

    } else if (t === 'error') {
      const r = d.reason;
      if (r === 'not_your_turn') log('не твой ход');
      else if (r === 'wrong_phase') log('сейчас не фаза раскрытия');
      else log('error: ' + r);

    } else if (t === 'pong') {
      // ok
    }
  };

  ws.onclose = (e) => {
    log(`closed: ${e.code}`);
    stopTimer();
    if (e.code === 4001) document.getElementById('error').textContent = 'Пустое имя';
    if (e.code === 4002) document.getElementById('error').textContent = 'Имя занято';
    if (e.code === 4003) document.getElementById('error').textContent = 'Лобби недоступно (полное / игра началась / нет хоста)';
    if (e.code === 4004) document.getElementById('error').textContent = 'Лобби не найдено';
    if (e.code === 4005) document.getElementById('error').textContent = 'Слишком длинное имя';
  };

  ws.onerror = () => log('ws ошибка');
};
</script>
</body>
</html>
